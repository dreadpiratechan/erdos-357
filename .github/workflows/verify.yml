# Repeats the formal verification on every push: clean build, statements, axiom audit of every declaration,
# upstream definition pin, kernel replay with lean4checker, exact-arithmetic checks of the written proofs,
# and the file manifest. The logs are uploaded as an artifact.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the file manifest
        run: python3 verification/make_manifest.py --check

      - name: Build lean4checker v4.27.0
        run: |
          git clone --depth 1 --branch v4.27.0 https://github.com/leanprover/lean4checker "$RUNNER_TEMP/lean4checker"
          cd "$RUNNER_TEMP/lean4checker" && lake build

      - name: Run every check from a clean build
        env:
          FETCH_CACHE: "1"
          PYTHON: python3
        run: LEAN4CHECKER="$RUNNER_TEMP/lean4checker/.lake/build/bin/lean4checker" bash verification/run_all.sh

      - name: Require every check to pass
        run: |
          s=verification/logs/SUMMARY.txt
          grep -q 'Build completed successfully' "$s"
          grep -q 'AXIOM AUDIT PASSED' "$s"
          grep -q '^headline: *13 axiom lines, 0 error lines' "$s"
          grep -q '^upstream pin: 4 axiom lines, 0 error lines' "$s"
          grep -q '^lean4checker: 6 of 6 modules exit 0' "$s"
          grep -q 'ALL 15 CHECKS PASSED' "$s"
          grep -q '^RESULT: PASS' "$s"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: verification/logs/
